apiVersion: v1
kind: Namespace
metadata:
  name: opspilot-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-reader
  namespace: opspilot-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - nonResourceURLs: [/api/v1]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opspilot-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opspilot-reader
subjects:
  - kind: ServiceAccount
    name: opspilot-reader
    namespace: opspilot-system
